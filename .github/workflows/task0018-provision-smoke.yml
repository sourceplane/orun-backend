name: Task 0018 — Queue Provision and Smoke

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to provision and smoke from
        required: true
        default: codex/task-0018-queue-provisioning

permissions:
  contents: read
  id-token: write   # Required to mint OIDC token for catalog sync smoke

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ORUN_API_URL: https://orun-api.sourceplane.ai
  ORUN_WORKERS_URL: https://orun-api.rahulvarghesepullely.workers.dev

jobs:
  provision-and-smoke:
    name: Provision queues, deploy Worker, verify consumer, run smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@10.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build workspace packages (required before wrangler deploy)
        run: pnpm exec turbo run build --filter="!@orun/worker" --filter="!@orun/dashboard"
        working-directory: .

      # ── Queue provisioning via Cloudflare REST API ──────────────────────────

      - name: Create orun-catalog-ingest queue (idempotent)
        working-directory: .
        run: |
          LIST_RESP=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")

          if echo "${LIST_RESP}" | jq -e '.result[] | select(.queue_name == "orun-catalog-ingest")' > /dev/null 2>&1; then
            echo "orun-catalog-ingest already exists — skipping create"
          else
            echo "Creating orun-catalog-ingest via Cloudflare API..."
            CREATE_RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"queue_name":"orun-catalog-ingest"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")
            echo "Create response: $(echo "${CREATE_RESP}" | jq '{success, errors}')"
            if ! echo "${CREATE_RESP}" | jq -e '.success == true' > /dev/null; then
              echo "ERROR: Failed to create orun-catalog-ingest"
              echo "${CREATE_RESP}" | jq .
              exit 1
            fi
            echo "orun-catalog-ingest created successfully"
          fi

      - name: Create orun-catalog-ingest-dlq queue (idempotent)
        working-directory: .
        run: |
          LIST_RESP=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")

          if echo "${LIST_RESP}" | jq -e '.result[] | select(.queue_name == "orun-catalog-ingest-dlq")' > /dev/null 2>&1; then
            echo "orun-catalog-ingest-dlq already exists — skipping create"
          else
            echo "Creating orun-catalog-ingest-dlq via Cloudflare API..."
            CREATE_RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"queue_name":"orun-catalog-ingest-dlq"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")
            echo "Create response: $(echo "${CREATE_RESP}" | jq '{success, errors}')"
            if ! echo "${CREATE_RESP}" | jq -e '.success == true' > /dev/null; then
              echo "ERROR: Failed to create orun-catalog-ingest-dlq"
              echo "${CREATE_RESP}" | jq .
              exit 1
            fi
            echo "orun-catalog-ingest-dlq created successfully"
          fi

      - name: Verify queues exist and capture queue IDs
        id: queue-ids
        working-directory: .
        run: |
          QUEUES_RESP=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")

          echo "=== Queue list ==="
          echo "${QUEUES_RESP}" | jq '.result[] | {queue_name, queue_id, consumers_total_count, producers_total_count}'

          INGEST_ID=$(echo "${QUEUES_RESP}" | jq -r '.result[] | select(.queue_name == "orun-catalog-ingest") | .queue_id')
          DLQ_ID=$(echo "${QUEUES_RESP}" | jq -r '.result[] | select(.queue_name == "orun-catalog-ingest-dlq") | .queue_id')

          if [ -z "${INGEST_ID}" ] || [ "${INGEST_ID}" = "null" ]; then
            echo "ERROR: orun-catalog-ingest queue_id not found"
            exit 1
          fi
          if [ -z "${DLQ_ID}" ] || [ "${DLQ_ID}" = "null" ]; then
            echo "ERROR: orun-catalog-ingest-dlq queue_id not found"
            exit 1
          fi

          echo "INGEST_QUEUE_ID=${INGEST_ID}" >> $GITHUB_ENV
          echo "DLQ_QUEUE_ID=${DLQ_ID}" >> $GITHUB_ENV
          echo "ingest_id=${INGEST_ID}" >> $GITHUB_OUTPUT
          echo "dlq_id=${DLQ_ID}" >> $GITHUB_OUTPUT
          echo "orun-catalog-ingest queue_id: ${INGEST_ID}"
          echo "orun-catalog-ingest-dlq queue_id: ${DLQ_ID}"

      # ── Deploy Worker ───────────────────────────────────────────────────────

      - name: Deploy Worker with queue bindings
        run: npx wrangler deploy --config wrangler.jsonc

      # ── Verify consumer attachment and settings ─────────────────────────────

      - name: Verify consumer attachment and settings via Cloudflare API
        working-directory: .
        run: |
          echo "=== Queue summary after deploy ==="
          QUEUES_RESP=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")
          echo "${QUEUES_RESP}" | jq '.result[] | {queue_name, consumers_total_count, producers_total_count}'

          # Check consumer count
          CONSUMER_COUNT=$(echo "${QUEUES_RESP}" | jq -r '.result[] | select(.queue_name == "orun-catalog-ingest") | .consumers_total_count')
          echo "orun-catalog-ingest consumer count: ${CONSUMER_COUNT}"
          if [ "${CONSUMER_COUNT}" = "0" ] || [ -z "${CONSUMER_COUNT}" ]; then
            echo "WARNING: consumer count is 0 — consumer may not have attached yet"
          else
            echo "✓ orun-catalog-ingest has ${CONSUMER_COUNT} consumer(s)"
          fi

          # Get detailed consumer settings via /queues/{queue_id}/consumers
          echo ""
          echo "=== Consumer detail for orun-catalog-ingest (queue_id: ${INGEST_QUEUE_ID}) ==="
          CONSUMERS_RESP=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${INGEST_QUEUE_ID}/consumers")
          echo "${CONSUMERS_RESP}" | jq '.result[] | {
            consumer_id,
            script_name,
            dead_letter_queue,
            settings: {
              batch_size: .settings.batch_size,
              max_retries: .settings.max_retries,
              max_wait_time_ms: .settings.max_wait_time_ms,
              max_concurrency: .settings.max_concurrency,
              visibility_timeout_ms: .settings.visibility_timeout_ms
            }
          }' 2>/dev/null || echo "${CONSUMERS_RESP}" | jq .

          # Verify consumer exists with expected script
          if ! echo "${CONSUMERS_RESP}" | jq -e '.result[] | select(.script_name == "orun-api")' > /dev/null 2>&1; then
            echo "WARNING: no consumer with script_name 'orun-api' found yet. Consumer attachment may be delayed."
          else
            echo "✓ Consumer script 'orun-api' confirmed"
            # Verify dead_letter_queue
            DLQ_NAME=$(echo "${CONSUMERS_RESP}" | jq -r '.result[] | select(.script_name == "orun-api") | .dead_letter_queue')
            echo "  dead_letter_queue: ${DLQ_NAME}"
            if [ "${DLQ_NAME}" = "orun-catalog-ingest-dlq" ]; then
              echo "✓ dead_letter_queue correct"
            else
              echo "WARNING: expected dead_letter_queue 'orun-catalog-ingest-dlq', got '${DLQ_NAME}'"
            fi
          fi

          # Confirm DLQ exists
          if ! echo "${QUEUES_RESP}" | jq -e '.result[] | select(.queue_name == "orun-catalog-ingest-dlq")' > /dev/null; then
            echo "ERROR: orun-catalog-ingest-dlq not found"
            exit 1
          fi
          echo "✓ orun-catalog-ingest-dlq confirmed"

      # ── Live endpoint smoke (OIDC) ──────────────────────────────────────────

      - name: Mint OIDC token (audience=orun)
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=orun" | jq -r '.value')
          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "ERROR: Failed to mint OIDC token"
            exit 1
          fi
          echo "::add-mask::${OIDC_TOKEN}"
          echo "token=${OIDC_TOKEN}" >> $GITHUB_OUTPUT

      - name: Build smoke envelope
        run: |
          SMOKE_ID="task18-$(date +%s)"
          GITHUB_REPOSITORY_ID="${{ github.repository_id }}"
          echo "SMOKE_ID=${SMOKE_ID}" >> $GITHUB_ENV
          echo "COMPONENT_ID=github:${GITHUB_REPOSITORY_ID}:${SMOKE_ID}" >> $GITHUB_ENV

          jq -n \
            --arg uploadId "${SMOKE_ID}" \
            --arg repo "${{ github.repository }}" \
            --arg repoId "${GITHUB_REPOSITORY_ID}" \
            --arg commit "${{ github.sha }}" \
            --arg compId "github:${GITHUB_REPOSITORY_ID}:${SMOKE_ID}" \
            --arg compName "${SMOKE_ID}" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              apiVersion: "orun.io/v1",
              kind: "CatalogSyncEnvelope",
              uploadId: $uploadId,
              schemaVersion: "1",
              source: {
                provider: "github",
                repo: $repo,
                repoId: $repoId,
                commit: $commit
              },
              components: [
                {
                  apiVersion: "orun.io/v1",
                  kind: "ComponentState",
                  source: {
                    provider: "github",
                    repository: $repo,
                    repoId: $repoId,
                    commit: $commit
                  },
                  component: {
                    id: $compId,
                    name: $compName,
                    type: "verification-smoke",
                    path: "apps/worker",
                    tags: ["task-0018", "smoke"]
                  },
                  environments: [
                    { name: "production", status: "healthy" }
                  ],
                  relations: [],
                  generatedAt: $now
                }
              ],
              generatedAt: $now
            }' > /tmp/task18-envelope.json
          echo "Envelope built with uploadId=${SMOKE_ID}"

      - name: POST catalog sync via custom domain (assert 202)
        id: smoke-custom
        continue-on-error: true
        working-directory: .
        run: |
          echo "Attempting POST to ${ORUN_API_URL}/v1/catalog/sync ..."
          HTTP_STATUS=$(curl -sS -o /tmp/task18-sync.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -X POST "${ORUN_API_URL}/v1/catalog/sync" \
            --data-binary @/tmp/task18-envelope.json)

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/task18-sync.json

          if [ "${HTTP_STATUS}" != "202" ]; then
            echo "WARN: Custom domain returned ${HTTP_STATUS}, not 202 — may be WAF challenge"
            exit 1
          fi
          echo "✓ POST ${ORUN_API_URL}/v1/catalog/sync → 202"

      - name: POST catalog sync via workers.dev (WAF bypass fallback)
        id: smoke-workers-dev
        if: steps.smoke-custom.outcome == 'failure'
        working-directory: .
        run: |
          echo "Custom domain failed. Attempting POST to ${ORUN_WORKERS_URL}/v1/catalog/sync ..."
          # Rebuild envelope with fresh smoke ID to avoid uploadId collision
          SMOKE_ID_WD="task18-wd-$(date +%s)"
          GITHUB_REPOSITORY_ID="${{ github.repository_id }}"
          echo "SMOKE_ID_WD=${SMOKE_ID_WD}" >> $GITHUB_ENV

          jq -n \
            --arg uploadId "${SMOKE_ID_WD}" \
            --arg repo "${{ github.repository }}" \
            --arg repoId "${GITHUB_REPOSITORY_ID}" \
            --arg commit "${{ github.sha }}" \
            --arg compId "github:${GITHUB_REPOSITORY_ID}:${SMOKE_ID_WD}" \
            --arg compName "${SMOKE_ID_WD}" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              apiVersion: "orun.io/v1",
              kind: "CatalogSyncEnvelope",
              uploadId: $uploadId,
              schemaVersion: "1",
              source: {
                provider: "github",
                repo: $repo,
                repoId: $repoId,
                commit: $commit
              },
              components: [
                {
                  apiVersion: "orun.io/v1",
                  kind: "ComponentState",
                  source: {
                    provider: "github",
                    repository: $repo,
                    repoId: $repoId,
                    commit: $commit
                  },
                  component: {
                    id: $compId,
                    name: $compName,
                    type: "verification-smoke",
                    path: "apps/worker",
                    tags: ["task-0018", "smoke", "workers-dev"]
                  },
                  environments: [
                    { name: "production", status: "healthy" }
                  ],
                  relations: [],
                  generatedAt: $now
                }
              ],
              generatedAt: $now
            }' > /tmp/task18-envelope-wd.json

          HTTP_STATUS=$(curl -sS -o /tmp/task18-sync-wd.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -X POST "${ORUN_WORKERS_URL}/v1/catalog/sync" \
            --data-binary @/tmp/task18-envelope-wd.json)

          echo "HTTP status (workers.dev): ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/task18-sync-wd.json

          if [ "${HTTP_STATUS}" != "202" ]; then
            echo "ERROR: workers.dev also returned ${HTTP_STATUS}, not 202"
            exit 1
          fi
          echo "✓ POST ${ORUN_WORKERS_URL}/v1/catalog/sync → 202 (via workers.dev)"

      - name: Fail if both smoke attempts failed
        if: steps.smoke-custom.outcome == 'failure' && steps.smoke-workers-dev.outcome != 'success'
        run: |
          echo "ERROR: POST /v1/catalog/sync failed on both custom domain and workers.dev"
          exit 1

      - name: Wait for queue delivery (30s batch timeout)
        run: sleep 35

      # ── Unauthenticated read check ─────────────────────────────────────────

      - name: Verify unauthenticated read returns 401 or 403
        working-directory: .
        run: |
          for URL in "${ORUN_API_URL}/v1/catalog/components" "${ORUN_WORKERS_URL}/v1/catalog/components"; do
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${URL}")
            echo "Unauthenticated GET ${URL} → HTTP ${HTTP_STATUS}"
            if [ "${HTTP_STATUS}" != "401" ] && [ "${HTTP_STATUS}" != "403" ]; then
              echo "ERROR: Expected 401 or 403, got ${HTTP_STATUS} for ${URL}"
              exit 1
            fi
            echo "✓ Unauthenticated read correctly returns ${HTTP_STATUS}"
          done

      # ── Summary ────────────────────────────────────────────────────────────

      - name: Summary
        if: always()
        run: |
          echo "=== Task 0018 Provision and Smoke Summary ==="
          echo "Branch: ${{ inputs.branch }}"
          echo "Commit: ${{ github.sha }}"
          echo "orun-catalog-ingest queue_id: ${INGEST_QUEUE_ID}"
          echo "orun-catalog-ingest-dlq queue_id: ${DLQ_QUEUE_ID}"
          echo "POST /v1/catalog/sync (custom domain): ${{ steps.smoke-custom.outcome }}"
          echo "POST /v1/catalog/sync (workers.dev fallback): ${{ steps.smoke-workers-dev.outcome }}"
          echo "Read endpoint verification (session-token-gated): requires manual run"
          echo "See ai/tasks/task-0018-verifier.md for manual read endpoint commands"
