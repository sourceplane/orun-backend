name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  review-plan:
    name: Review Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize orun workspace
        uses: sourceplane/kiox-action@v2.1.2
        with:
          version: v0.4.3

      - name: Compile review-scoped plan
        run: kiox -- orun plan --changed

  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize orun workspace
        uses: sourceplane/kiox-action@v2.1.2
        with:
          version: v0.4.3

      - name: Execute (PR - changed only)
        if: github.event_name == 'pull_request'
        id: orun-pr
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          kiox -- orun run --changed 2>&1 | tee /tmp/orun-run.log

      - name: Execute (production - all components)
        if: github.event_name == 'push'
        id: orun-push
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          kiox -- orun run 2>&1 | tee /tmp/orun-run.log

      - name: Show failed job logs
        if: failure()
        run: |
          exec_id=$(grep -oP 'Run: \K\S+' /tmp/orun-run.log | tail -1)
          echo "Fetching failed logs for exec-id: ${exec_id}"
          kiox -- orun logs --exec-id "${exec_id}" --failed 2>&1 || true
